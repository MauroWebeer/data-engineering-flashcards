<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engineering Flashcards</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Header -->
    <header class="w-full max-w-4xl text-center py-6">
        <h1 class="text-3xl font-bold tracking-tight text-indigo-400">Data Engineering Flashcards</h1>
        <p class="text-slate-400 text-sm mt-1">Treinamento técnico interativo integrado ao Notion</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl flex-grow flex flex-col items-center justify-center my-8">
        
        <!-- Loading State -->
        <div id="loading" class="text-slate-400 animate-pulse text-lg">Carregando cards do Notion...</div>

        <!-- Grid Container (Estado 1) -->
        <div id="cards-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full"></div>

        <!-- Single Active Card Container (Estados 2 e 3) -->
        <div id="active-card-container" class="hidden w-full max-w-xl flex flex-col items-center">
            <div id="flashcard" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl cursor-pointer transition-all duration-300 min-h-[260px] flex flex-col justify-between text-center select-none hover:border-indigo-500">
                
                <!-- Card Header (Tema & Número) -->
                <div class="flex justify-between items-center text-xs font-semibold text-indigo-400 uppercase tracking-wider">
                    <span id="card-theme-label">Tema</span>
                    <span id="card-number-label">#0</span>
                </div>

                <!-- Card Content (Pergunta/Resposta) -->
                <div class="my-auto py-6">
                    <h3 id="card-main-text" class="text-xl font-medium text-slate-100">Pergunta aqui</h3>
                </div>

                <!-- Card Footer Instruction -->
                <div class="text-xs text-slate-400 italic">
                    <span id="card-instruction">Clique para revelar a resposta</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex gap-4 mt-6">
                <button id="btn-back" class="px-5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition-colors">
                    ← Voltar ao Grid
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-400 py-4">
        Powered by FastAPI & Notion API
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const API_URL = "http://127.0.0.1:8000/api/cards";
        
        let cardsData = [];
        let currentState = "GRID"; // "GRID", "QUESTION", "ANSWER"
        let activeCard = null;

        const loadingEl = document.getElementById("loading");
        const gridEl = document.getElementById("cards-grid");
        const activeContainerEl = document.getElementById("active-card-container");
        const flashcardEl = document.getElementById("flashcard");
        const themeLabelEl = document.getElementById("card-theme-label");
        const numberLabelEl = document.getElementById("card-number-label");
        const mainTextEl = document.getElementById("card-main-text");
        const instructionEl = document.getElementById("card-instruction");
        const btnBackEl = document.getElementById("btn-back");

        async function fetchCards() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                if (result.status === "success") {
                    cardsData = result.data;
                    renderGrid();
                } else {
                    loadingEl.textContent = "Erro ao carregar os dados.";
                }
            } catch (error) {
                console.error("Erro de conexão:", error);
                loadingEl.textContent = "Erro de conexão com o backend FastAPI.";
            }
        }

        function renderGrid() {
            loadingEl.classList.add("hidden");
            gridEl.classList.remove("hidden");
            activeContainerEl.classList.add("hidden");
            
            gridEl.innerHTML = "";
            cardsData.forEach((card, index) => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md hover:shadow-indigo-500/10 hover:border-indigo-500 cursor-pointer transition-all flex flex-col justify-between h-40";
                cardDiv.innerHTML = `
                    <div class="flex justify-between items-center text-xs font-semibold text-indigo-400">
                        <span>#${card.card_number ?? (index + 1)}</span>
                        <span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-[10px]">${card.card_theme || 'Geral'}</span>
                    </div>
                    <div class="my-auto">
                        <h3 class="text-sm font-medium text-slate-200 line-clamp-2">${card.card_question}</h3>
                    </div>
                    <div class="text-[11px] text-slate-400 text-right">Abrir card →</div>
                `;
                cardDiv.addEventListener("click", () => selectCard(card));
                gridEl.appendChild(cardDiv);
            });
        }

        function selectCard(card) {
            activeCard = card;
            currentState = "QUESTION";
            
            gridEl.classList.add("hidden");
            activeContainerEl.classList.remove("hidden");
            
            themeLabelEl.textContent = card.card_theme || "Geral";
            numberLabelEl.textContent = `#${card.card_number ?? '—'}`;
            mainTextEl.textContent = card.card_question;
            instructionEl.textContent = "Clique no card para revelar a resposta";
        }

        flashcardEl.addEventListener("click", () => {
            if (currentState === "QUESTION") {
                currentState = "ANSWER";
                mainTextEl.textContent = activeCard.card_answer;
                instructionEl.textContent = "Clique novamente para retornar ao grid";
                flashcardEl.classList.add("border-indigo-500");
            } else if (currentState === "ANSWER") {
                renderGrid();
                currentState = "GRID";
                activeCard = null;
                flashcardEl.classList.remove("border-indigo-500");
            }
        });

        btnBackEl.addEventListener("click", () => {
            renderGrid();
            currentState = "GRID";
            activeCard = null;
        });

        // Inicializar aplicação
        fetchCards();
    </script>
</body>
</html>
