<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Flashcards (Random)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <header class="w-full max-w-4xl flex items-center justify-between py-6">
        <a href="index.html" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition-colors border border-slate-700 flex items-center gap-1.5">
            <span>← Home</span>
        </a>
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">Theme Flashcards</h1>
            <p class="text-slate-400 text-xs mt-0.5">Randomized Active Recall</p>
        </div>
        <div class="w-16"></div>
    </header>

    <main class="w-full max-w-4xl flex-grow flex flex-col items-center justify-center my-8">
        <div id="loading" class="flex flex-col items-center gap-3 text-slate-400">
            <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm">Loading randomized cards...</p>
        </div>

        <div id="error-state" class="hidden flex flex-col items-center text-center gap-4 bg-slate-800 border border-red-500/30 p-8 rounded-xl max-w-md shadow-lg">
            <h3 class="text-lg font-semibold text-slate-200">Connection Failed</h3>
            <p id="error-message" class="text-xs text-slate-400 mt-1">Could not connect to backend.</p>
            <button onclick="fetchCards()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg">Try Again</button>
        </div>

        <div id="cards-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full"></div>

        <div id="active-card-container" class="hidden w-full max-w-xl flex flex-col items-center">
            <div id="flashcard" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl cursor-pointer transition-all duration-300 min-h-[280px] flex flex-col justify-between text-center select-none hover:border-indigo-500">
                <div class="flex justify-between items-center text-xs font-semibold text-indigo-400 uppercase tracking-wider">
                    <span id="card-state-label">Theme</span>
                    <span>Random Mode</span>
                </div>
                <div class="my-auto py-6">
                    <h3 id="card-main-text" class="text-3xl font-extrabold text-indigo-300">Theme here</h3>
                </div>
                <div class="text-xs text-slate-400 italic">
                    <span id="card-instruction">Click to reveal question</span>
                </div>
            </div>
            <div class="flex gap-4 mt-6">
                <button id="btn-back" class="px-5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition-colors">
                    ← Back to Grid
                </button>
            </div>
        </div>
    </main>

    <footer class="text-xs text-slate-400 py-4">
        Powered by FastAPI & Notion API
    </footer>

    <script>
        const API_URL = "http://127.0.0.1:8000/api/cards";
        let cardsData = [];
        let currentState = "THEME";
        let activeCard = null;

        const loadingEl = document.getElementById("loading");
        const errorStateEl = document.getElementById("error-state");
        const errorMessageEl = document.getElementById("error-message");
        const gridEl = document.getElementById("cards-grid");
        const activeContainerEl = document.getElementById("active-card-container");
        const flashcardEl = document.getElementById("flashcard");
        const stateLabelEl = document.getElementById("card-state-label");
        const mainTextEl = document.getElementById("card-main-text");
        const instructionEl = document.getElementById("card-instruction");
        const btnBackEl = document.getElementById("btn-back");

        function showState(state) {
            loadingEl.classList.add("hidden");
            errorStateEl.classList.add("hidden");
            gridEl.classList.add("hidden");
            activeContainerEl.classList.add("hidden");

            if (state === "LOADING") loadingEl.classList.remove("hidden");
            if (state === "ERROR") errorStateEl.classList.remove("hidden");
            if (state === "GRID") gridEl.classList.remove("hidden");
            if (state === "ACTIVE") activeContainerEl.classList.remove("hidden");
        }

        // Algoritmo de Fisher-Yates para embaralhar o array de forma aleatória
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function fetchCards() {
            showState("LOADING");
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const result = await response.json();
                if (result.status === "success") {
                    cardsData = shuffleArray([...result.data]); // Embaralha para aleatoriedade
                    renderGrid();
                } else {
                    throw new Error("Invalid response format.");
                }
            } catch (error) {
                errorMessageEl.textContent = error.message;
                showState("ERROR");
            }
        }

        function renderGrid() {
            showState("GRID");
            gridEl.innerHTML = "";
            
            cardsData.forEach((card) => {
                const cardDiv = document.createElement("div");
                cardDiv.className = "bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md hover:shadow-indigo-500/10 hover:border-indigo-500 cursor-pointer transition-all flex flex-col justify-between h-40";
                cardDiv.innerHTML = `
                    <div class="flex justify-between items-center text-xs font-semibold text-indigo-400">
                        <span></span>
                        <span class="text-[10px] text-slate-400 uppercase tracking-wider">Concept</span>
                    </div>
                    <div class="my-auto text-center">
                        <h3 class="text-lg font-bold text-slate-100">${card.card_theme || 'General'}</h3>
                    </div>
                    <div class="text-[11px] text-slate-400 text-right">Study theme →</div>
                `;
                cardDiv.addEventListener("click", () => selectCard(card));
                gridEl.appendChild(cardDiv);
            });
        }

        function selectCard(card) {
            activeCard = card;
            currentState = "THEME";
            showState("ACTIVE");
            
            stateLabelEl.textContent = "Selected Theme";
            mainTextEl.textContent = card.card_theme || "General";
            mainTextEl.className = "text-3xl font-extrabold text-indigo-300";
            instructionEl.textContent = "Click to reveal question";
            flashcardEl.classList.remove("border-indigo-500");
        }

        flashcardEl.addEventListener("click", () => {
            if (currentState === "THEME") {
                currentState = "QUESTION";
                stateLabelEl.textContent = "Question";
                mainTextEl.textContent = activeCard.card_question;
                mainTextEl.className = "text-xl font-medium text-slate-100";
                instructionEl.textContent = "Click to reveal answer";
                flashcardEl.classList.add("border-indigo-500");
            } else if (currentState === "QUESTION") {
                currentState = "ANSWER";
                stateLabelEl.textContent = "Answer";
                mainTextEl.textContent = activeCard.card_answer;
                mainTextEl.className = "text-xl font-medium text-emerald-300";
                instructionEl.textContent = "Click again to return to grid";
            } else if (currentState === "ANSWER") {
                renderGrid();
                currentState = "GRID";
                activeCard = null;
            }
        });

        btnBackEl.addEventListener("click", () => {
            renderGrid();
            currentState = "GRID";
            activeCard = null;
        });

        fetchCards();
    </script>
</body>
</html>
